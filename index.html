/* ── DESIGN TOKENS ── */

/* Create an image wrapper with skeleton loading */
const IC = {}; // cache
function mkImg(key, h='100%', caption='') {
  const url = IMGS[key] || IMGS.hero;
  const wrap = document.createElement('div');
  wrap.className = 'img-wrap';
  wrap.style.height = h;
  // Skeleton
  const skel = document.createElement('div');
  skel.className = 'img-skeleton';
  wrap.appendChild(skel);
  // Image
  const img = document.createElement('img');
  img.alt = caption || key.replace(/_/g,' ');
  img.loading = 'lazy';
  img.onload = () => { img.classList.add('loaded'); skel.style.display='none'; };
  img.src = url;
  wrap.appendChild(img);
  if (caption) {
    const cap = document.createElement('div');
    cap.className = 'img-caption';
    cap.textContent = caption;
    wrap.appendChild(cap);
  }
  return wrap;
}

function navigate(page, offer, push=true) {
  const app = document.getElementById('app');
  app.classList.add('fade');
  setTimeout(() => {
    app.innerHTML = '';
    if (page === 'home') renderHome();
    else renderOffer(offer);
    app.classList.remove('fade');
    window.scrollTo(0,0);
    setTimeout(() => { initRev(); if (page==='home') setTimeout(initMap,360); }, 60);
  }, 190);
  if (push) history.pushState({page,offer},'', page==='home' ? '/' : `/offer/${offer?.id||''}`);
}
window.addEventListener('popstate', e => e.state && navigate(e.state.page, e.state.offer, false));
function gh() { navigate('home',null) }

/* ══════════════════════════════

══════════════════════════════ */
function initRev() {
  const obs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('on') }), { threshold:.07, rootMargin:'0px 0px -24px 0px' });
  document.querySelectorAll('.rv,.rvl,.rvr').forEach(el => obs.observe(el));
}

  const p=document.createElement('div'); p.className='sp act';

  if(mS===1){
    p.innerHTML=`<div class="frow"><div class="fg"><label>First Name *</label><input id="f1" placeholder="James" value="${mD.firstName||''}"></div><div class="fg"><label>Last Name *</label><input id="f2" placeholder="Smith" value="${mD.lastName||''}"></div></div><div class="fg"><label>Mobile Number *</label><input id="f3" type="tel" placeholder="07700 900000" value="${mD.phone||''}"></div><div class="fg"><label>Email Address *</label><input id="f4" type="email" placeholder="james@example.com" value="${mD.email||''}"></div><div class="fg"><label>Pickup Postcode *</label><input id="f5" placeholder="TW1 3SN" value="${mD.post||''}"></div><div class="frow"><div class="fg"><label>Preferred Day</label><select id="f6"><option>Any day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div><div class="fg"><label>Preferred Time</label><select id="f7"><option>Any time</option><option>Morning (7–12pm)</option><option>Afternoon (12–5pm)</option><option>Evening (5–8pm)</option></select></div></div>`;
  } else if(mS===2){
    p.innerHTML=`<div class="fg"><label>Do you have a practical test booked? *</label><div class="rpills">${['Yes – date confirmed','Yes – waiting for a date','No – not yet booked','I\'ve already passed'].map(v=>`<div class="rp${mD.testBooked===v?' sel':''}" onclick="ps(this,'testBooked','${v}')">${v}</div>`).join('')}</div><div class="drev${mD.testBooked==='Yes – date confirmed'?' show':''}" id="drev"><div class="fg" style="margin-top:10px"><label>Test Date</label><input type="date" id="ftd" value="${mD.testDate||''}" onchange="mD.testDate=this.value"></div></div></div><div class="fg"><label>Have you passed your theory test? *</label><div class="rpills">${['Yes – passed ✓','No – not yet','Currently studying'].map(v=>`<div class="rp${mD.theory===v?' sel':''}" onclick="ps(this,'theory','${v}')">${v}</div>`).join('')}</div></div><div class="fg"><label>Transmission preference</label><div class="rpills">${['Manual 🚗','Automatic ⚡','Not sure yet'].map(v=>`<div class="rp${mD.lt===v?' sel':''}" onclick="ps(this,'lt','${v}')">${v}</div>`).join('')}</div></div>`;
  } else if(mS===3){
    const exp=[['🌱','Complete beginner','Never driven before'],['📚','Some prior lessons','Stopped & restarting'],['🚦','Reasonable experience','Getting close to test-ready'],['❌','Failed a test','Want to pass next time'],['🔄','Already hold a licence','Need a refresher'],['🌍','Foreign licence holder','Converting to UK']];
    p.innerHTML=`<div class="fg"><label>Your current driving experience *</label><div class="cgrid">${exp.map(([ic,h,sub])=>`<div class="cc${mD.exp===h?' sel':''}" onclick="cs(this,'exp','${h}')"><span style="font-size:1.1rem;flex-shrink:0">${ic}</span><span><strong>${h}</strong><br><small style="color:var(--t3);font-weight:400">${sub}</small></span></div>`).join('')}</div></div>`;
  } else if(mS===4){
    const st=['Junctions & roundabouts','Parallel parking','Clutch control','Motorway driving','Observation & mirrors','Bay parking','Test nerves & anxiety','Night driving','Speed & hazard judgement'];
    p.innerHTML=`<div class="fg"><label>Where do you struggle most? <span style="color:var(--t3);text-transform:none;letter-spacing:0;font-weight:400">(select all that apply)</span></label><div class="cgrid g3">${st.map(s=>`<div class="cc${mD.struggles.includes(s)?' sel':''}" onclick="ct(this,'${s}')">${s}</div>`).join('')}</div></div><div class="fg" style="margin-top:5px"><label>Additional needs or notes <span style="color:var(--t3);text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label><textarea id="fnotes" placeholder="e.g. I have dyslexia and prefer written feedback after lessons. Evenings only. Test booked at Isleworth on the 20th — need urgent preparation…">${mD.notes||''}</textarea></div>`;
  } else if(mS===5){
    const rows=[['Package',mD.pkg,true],['Name',mD.name||'—',false],['Mobile',mD.phone||'—',false],['Email',mD.email||'—',false],['Postcode',mD.post||'—',false],['Availability',`${mD.day||'Any day'}, ${mD.time||'Any time'}`,false],['Test booked',mD.testBooked||'—',false],['Theory test',mD.theory||'—',false],['Transmission',mD.lt||'Not specified',false],['Experience',mD.exp||'—',false],['Struggles',mD.struggles.length?mD.struggles.join(', '):'None selected',false],['Notes',mD.notes||'None',false]];
    p.innerHTML=`<p style="font-size:.79rem;color:var(--t3);margin-bottom:13px;line-height:1.65">Please review your details before we send your enquiry to an instructor.</p><div class="sumg">${rows.map(([l,v,hi])=>`<div class="sumr"><span class="suml">${l}</span><span class="sumv${hi?' hi':''}">${v}</span></div>`).join('')}</div>`;
  }

  body.appendChild(p);
  document.getElementById('mbk').style.visibility=mS>1?'visible':'hidden';
  const nx=document.getElementById('mnx');
  nx.textContent=mS===5?'Send Enquiry ✓':'Continue →';
  nx.className=mS===5?'msub':'mnext';
  document.getElementById('mftr').style.display='';
}

function ps(el,key,val){
  mD[key]=val;
  el.closest('.rpills').querySelectorAll('.rp').forEach(p=>p.classList.remove('sel'));
  el.classList.add('sel');
  if(key==='testBooked') document.getElementById('drev')?.classList.toggle('show',val==='Yes – date confirmed');
}
function cs(el,key,val){
  mD[key]=val;
  el.closest('.cgrid').querySelectorAll('.cc').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function ct(el,val){
  const i=mD.struggles.indexOf(val);
  if(i>-1){mD.struggles.splice(i,1);el.classList.remove('sel');}
  else{mD.struggles.push(val);el.classList.add('sel');}
}
function showE(m){const e=document.getElementById('merr');if(e){e.textContent=m;}}
function clearE(){const e=document.getElementById('merr');if(e)e.textContent='';}

function valS(){
  clearE();
  if(mS===1){
    const f1=document.getElementById('f1')?.value.trim();
    const f3=document.getElementById('f3')?.value.trim();
    const f4=document.getElementById('f4')?.value.trim();
    const f5=document.getElementById('f5')?.value.trim();
    if(!f1||!f3||!f4||!f5){showE('Please fill in all required fields.');return false;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f4)){showE('Please enter a valid email address.');return false;}
    mD.firstName=f1; mD.lastName=document.getElementById('f2')?.value.trim()||'';
    mD.name=`${mD.firstName} ${mD.lastName}`.trim();
    mD.phone=f3; mD.email=f4; mD.post=f5;
    mD.day=document.getElementById('f6')?.value||''; mD.time=document.getElementById('f7')?.value||'';
  }
  if(mS===2&&!mD.testBooked){showE('Please select your test status.');return false;}
  if(mS===3&&!mD.exp){showE('Please select your experience level.');return false;}
  if(mS===4)mD.notes=document.getElementById('fnotes')?.value||'';
  return true;
}
function nS(){if(!valS())return;if(mS===5){subEnq();return;}mS++;renderM();}
function pS(){if(mS>1){mS--;renderM();}}

function subEnq(){
  document.getElementById('mbody').innerHTML=`<div class="succ"><div class="scc">✓</div><h3>Enquiry Sent!</h3><p>Thanks, <strong>${mD.firstName||'there'}</strong>! Your instructor will call you within 2 hours to confirm your first lesson and answer any questions.</p><div class="cbox"><p>Can't wait? Call us now:</p><strong>📞 020 8977 1234</strong></div></div>`;
  document.getElementById('mftr').style.display='none';
  document.querySelectorAll('.pdot').forEach(d=>{d.className='pdot done';d.textContent='✓';});
  document.querySelectorAll('.pline').forEach(l=>l.classList.add('done'));
}

/* ══════════════════════════════
   BOOT
══════════════════════════════ */
renderHome();
setTimeout(()=>{ initRev(); setTimeout(initMap,380); }, 70);
</script>
</body>
</html>
